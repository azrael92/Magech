<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0908;
      color: #faf3e0;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    #reader-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #reader-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.2rem;
      background: rgba(26, 23, 20, 0.95);
      border-bottom: 1px solid rgba(45, 38, 32, 0.8);
      flex-shrink: 0;
      gap: 1rem;
    }

    #book-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #8c8270;
      font-family: 'JetBrains Mono', 'Menlo', monospace;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-btn {
      background: rgba(74, 58, 111, 0.25);
      border: 1px solid rgba(122, 108, 176, 0.2);
      color: #9d8fd0;
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover { background: rgba(74, 58, 111, 0.45); color: #c4b8e8; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    #progress-text {
      font-size: 0.72rem;
      color: #4a4439;
      font-family: 'JetBrains Mono', 'Menlo', monospace;
      flex-shrink: 0;
    }

    #viewer-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0908;
      color: #4a4439;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', 'Menlo', monospace;
      letter-spacing: 0.12em;
    }
    #loading.hidden { display: none; }

    #error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0908;
      color: #9d8fd0;
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
      display: none;
    }
  </style>
</head>
<body>
<div id="reader-shell">
  <div id="reader-toolbar">
    <button class="nav-btn" id="btn-prev">← Prev</button>
    <span id="book-title">Loading…</span>
    <span id="progress-text"></span>
    <button class="nav-btn" id="btn-next">Next →</button>
  </div>
  <div id="viewer-wrap">
    <div id="loading">opening book…</div>
    <div id="error">Could not load the epub file. Check that the file path is correct.</div>
    <div id="viewer"></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file');

  if (!file) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error').style.display = 'flex';
  } else {
    const book = ePub(file);
    const rendition = book.renderTo('viewer', {
      width: '100%',
      height: '100%',
      spread: 'none',
      flow: 'paginated',
      manager: 'default',
    });

    // Apply dark theme to rendered content
    rendition.themes.register('dark', {
      'html': {
        'background': '#0a0908 !important',
        'color': '#faf3e0 !important',
      },
      'body': {
        'background': '#0a0908 !important',
        'color': '#faf3e0 !important',
        'font-family': 'Georgia, serif !important',
        'line-height': '1.72 !important',
        'padding': '2rem 2.5rem !important',
        'max-width': '680px',
        'margin': '0 auto !important',
      },
      'p': {
        'color': '#e8dfc8 !important',
        'margin-bottom': '1.1em !important',
      },
      'h1, h2, h3, h4': {
        'color': '#faf3e0 !important',
        'margin-top': '1.8em !important',
        'margin-bottom': '0.6em !important',
      },
      'a': { 'color': '#9d8fd0 !important' },
    });
    rendition.themes.select('dark');

    rendition.display().then(() => {
      document.getElementById('loading').classList.add('hidden');
    }).catch(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').style.display = 'flex';
    });

    book.loaded.metadata.then(meta => {
      const title = meta.title || file.split('/').pop().replace('.epub', '').replace(/-/g, ' ');
      document.getElementById('book-title').textContent = title;
      document.title = title + ' — Reader';
    });

    book.ready.then(() => {
      return book.locations.generate(1000);
    }).then(() => {
      updateProgress();
    });

    function updateProgress() {
      const loc = rendition.currentLocation();
      if (!loc || !loc.start) return;
      const pct = book.locations.percentageFromCfi(loc.start.cfi);
      if (pct !== undefined) {
        document.getElementById('progress-text').textContent = Math.round(pct * 100) + '%';
      }
    }

    rendition.on('relocated', updateProgress);

    document.getElementById('btn-prev').addEventListener('click', () => rendition.prev());
    document.getElementById('btn-next').addEventListener('click', () => rendition.next());

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') rendition.prev();
      if (e.key === 'ArrowRight') rendition.next();
    });
  }
</script>
</body>
</html>
